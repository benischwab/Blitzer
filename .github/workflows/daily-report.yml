name: NBA Tagesbericht

on:
  schedule:
    # Hauptbericht: 15:30 UTC = 16:30 Uhr Winterzeit / 17:30 Uhr Sommerzeit (Schweiz)
    - cron: "30 15 * * *"
    # Updates bis kurz vor Spielbeginn (neue Ausfaelle, News, Linien, Resultate).
    # Gemeldet wird nur, wenn sich etwas Relevantes geaendert hat.
    - cron: "30 19 * * *"
    - cron: "15 22 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "report = neuer Bericht, update = nur Aenderungen melden"
        type: choice
        options: [report, update]
        default: report

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Daten aktualisieren und Bericht erstellen
        id: run
        run: |
          if [ "${{ github.event.schedule }}" = "30 15 * * *" ] || [ "${{ inputs.mode }}" = "report" ]; then
            python -m nba_tipp report > /dev/null
          else
            python -m nba_tipp update
          fi

      - name: Bericht und Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "NBA-Bericht $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -X ours origin "${GITHUB_REF_NAME}" || true
          git push

      - name: Neuer Bericht als GitHub-Issue
        if: steps.run.outputs.mode == 'report'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create nba-tipp --color 1d76db --force >/dev/null
          for n in $(gh issue list --label nba-tipp --state open --json number -q '.[].number'); do
            gh issue close "$n" >/dev/null
          done
          { cat reports/latest.md; echo; echo "@${{ github.repository_owner }}"; } > /tmp/body.md
          gh issue create --title "$(cat reports/latest_title.txt)" --label nba-tipp --body-file /tmp/body.md \
            | tee /tmp/issue_url.txt

      - name: Update im bestehenden Issue
        if: steps.run.outputs.mode == 'update' && steps.run.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label nba-tipp --state open --json number -q '.[0].number')
          if [ -z "$n" ]; then exit 0; fi
          gh issue edit "$n" --body-file reports/latest.md >/dev/null
          { echo "**Update $(TZ=Europe/Zurich date +%H:%M) Uhr**"; echo; echo '```'; cat reports/latest_kurz.txt; echo '```';
            echo; echo "@${{ github.repository_owner }}"; } > /tmp/comment.md
          gh issue comment "$n" --body-file /tmp/comment.md | tee /tmp/issue_url.txt

      - name: Push-Nachricht (optional)
        if: steps.run.outputs.changed == '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export REPORT_URL="$(tail -n1 /tmp/issue_url.txt 2>/dev/null)"
          python -m nba_tipp.notify
